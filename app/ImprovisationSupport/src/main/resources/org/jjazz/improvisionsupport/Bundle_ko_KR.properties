DenseSparse1DisplayName=밀도 조절 연습 - 1단계
DenseSparseHelpText=이것은 How to Improvise - Hal Crook 교본의 연주하기/쉬기 연습의 변형입니다.\n\n“속도나 프레이즈의 길이와 마찬가지로, 리듬적 밀도는 즉흥 연주에서 매우 두드러지는 요소 중 하나이다.”\n\n“‘밀도 높은’ 프레이즈란 연주 내용이 바쁘거나 복잡하게 들리는 것을 의미하며, 대개 짧은 음이 많이 포함된다. ‘밀도 낮은’ 프레이즈는 연주 내용이 비교적 한가하고 단순하게 들리는 것을 의미하며, 대개 음의 수가 적거나 음이 길게 이어진다.”\n\n“이 연습의 목적은 각 프레이즈에서 연주되는 음의 양을 조절하고 균형을 잡는 데 익숙해져, 연주에 다양성과 흥미를 더하는 것이다.”
