PlayRestHelpText=이것은 How to Improvise - Hal Crook 교본의 기초 연습입니다. 그렇게 어렵지는 않지만 귀하가 더 흥미로운 솔로 연주를 할 수 있도록 효과적으로 도울 것입니다.\n\n"이것은 당신이 계속 연주하고 있을 때 갈피를 잡기 어려운 솔로 연주의 방향을 조정하고, 이를 연습할 수 있는 기회를 제공한다."\n\n"매 쉬는 순간마다, 당신의 마음 속으로 이전에 떠올린 음악적 잔향을 생각해 보라. 처음에는 당신이 너무 많이 쉬어서 계속 연주하지 않는 이상은 즉흥 연주를 하지 않고 있다고 생각할 수도 있다. 연주하는 것과 쉬는 것 양 쪽에 모두 익숙해지려고 노력하라. 이것을 실험처럼 해 보고, 무엇이 일어나는지 관찰하라."
