ToolbarPanel.fbtn_help.helpText=- <b>Alt + коліщатко миші, Alt + вгору/вниз</b> \: зміна швидкості вибраних нот<br/>\n- натисніть <b>Alt</b> під час редагування нот, щоб тимчасово вимкнути налаштування «прив’язки до сітки»<br/>\n- <b>Q</b> \: квантизація<br/>\n- <b>Ctrl  коліщатко миші</b>\: горизонтальне масштабування (Shift — для вертикального масштабування)<br/>\n- <b>Ctrl  F</b> \: масштабування, щоб спробувати вмістити всі ноти<br/>\n- перетягування мишею по <b>лінійці</b> \: встановлення зони циклічного відтворення<br/>\n- <b>Ctrl + перетягування мишею</b> \: переміщення редактора<br/>\n- клавіші <b>Home / End</b> \: переміщення редактора до початку / кінця<br/>\n- <b>перетягніть</b> Midi файл у редактор, щоб імпортувати його ноти<br/>\n
